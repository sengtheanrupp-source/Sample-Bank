name: Build APK & iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash setup.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: romdoul-bank-apk
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash setup.sh
      # Unsigned build. For TestFlight/App Store add signing (see README).
      - run: flutter build ipa --release --no-codesign
      - run: cd build/ios/archive && zip -qr ../../../Runner.xcarchive.zip Runner.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: romdoul-bank-ios-unsigned
          path: Runner.xcarchive.zip
