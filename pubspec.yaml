name: romdoul_bank
description: "Romdoul Bank (sample) - fast KHQR scan & pay"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"  # Flutter 3.27+

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^6.0.10   # camera + gallery QR decoding (ML Kit / Apple Vision)
  image_picker: ^1.1.2      # "Upload QR" from gallery
  local_auth: ^2.3.0        # Face ID / fingerprint / device PIN before paying
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2       # base URL / issuer / demo flag
  flutter_secure_storage: ^9.2.2   # API token (Keychain / Keystore)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
